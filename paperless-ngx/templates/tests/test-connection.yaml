apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "paperless-ngx.fullname" . }}-test-connection"
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['sh', '-ec']
      args:
        - >
          attempts=0;
          max_attempts=30;
          retry_interval_seconds=2;
          until wget -q -O /dev/null "{{ include "paperless-ngx.fullname" . }}:{{ .Values.paperless.service.port }}/api/";
          do
            attempts=$((attempts+1));
            [ "$attempts" -ge "$max_attempts" ] && exit 1;
            sleep "$retry_interval_seconds";
          done
  restartPolicy: Never
