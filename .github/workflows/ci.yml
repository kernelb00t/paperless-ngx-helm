name: Helm Chart CI

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 0 – Detect whether CI should run for this change set
  # ---------------------------------------------------------------------------
  changes:
    name: Detect chart-related changes
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.filter.outputs.run_ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            run_ci:
              - "paperless-ngx/**"
              - "ct.yaml"
              - ".github/workflows/ci.yml"
              - ".github/scripts/**"

  # ---------------------------------------------------------------------------
  # Job 1.1 – Kube-linter: static security and best practices analysis
  # ---------------------------------------------------------------------------
  kube-linter:
    name: Kube-linter
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan chart with kube-linter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: paperless-ngx
          format: sarif
          output-file: kube-linter.sarif
        continue-on-error: true # Don't block yet, just report

      - name: Upload kube-linter SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: kube-linter.sarif
          category: kube-linter

  # ---------------------------------------------------------------------------
  # Job 1 – Lint: static validation without a running cluster
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run_ci == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2
        with:
          version: 3.14.0

      - name: Render chart templates
        run: |
          helm template paperless-ngx ./paperless-ngx \
            --values paperless-ngx/ci/ct-values.yaml \
            --debug > /dev/null

      - name: Run chart-testing (lint)
        run: ct lint --config ct.yaml --all

      - name: Install helm-unittest
        run: |
          # Helm 4 cannot GPG-verify plugins installed from git.
          VERIFY=""
          if helm version --short | grep -q '^v4'; then VERIFY="--verify=false"; fi
          helm plugin install https://github.com/helm-unittest/helm-unittest.git \
            --version v1.2.1 $VERIFY

      - name: Run template unit tests
        run: helm unittest paperless-ngx

  # ---------------------------------------------------------------------------
  # Job 2 – Integration: full cluster deployment on KinD
  #   install – fresh install of this chart
  #   upgrade – install the latest published chart, write data, upgrade to
  #             this chart and check the data survived
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    needs: [lint, changes]
    if: needs.changes.outputs.run_ci == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [install, upgrade]
    env:
      NAMESPACE: paperless-test
      RELEASE: paperless-ngx
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0

      - name: Install CloudNativePG operator
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm upgrade --install cnpg cnpg/cloudnative-pg \
            --namespace cnpg-system \
            --create-namespace \
            --wait \
            --timeout 5m

      - name: Generate credentials
        run: |
          SECRET_KEY="$(openssl rand -hex 32)"
          ADMIN_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::${SECRET_KEY}"
          echo "::add-mask::${ADMIN_PASSWORD}"
          echo "SECRET_KEY=${SECRET_KEY}" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=${ADMIN_PASSWORD}" >> "$GITHUB_ENV"

      - name: Install latest published chart
        if: matrix.scenario == 'upgrade'
        run: |
          helm install "$RELEASE" oci://ghcr.io/kernelb00t/paperless-ngx \
            --values paperless-ngx/ci/ct-values.yaml \
            --set "paperless.secrets.PAPERLESS_SECRET_KEY=${SECRET_KEY}" \
            --set "paperless.secrets.PAPERLESS_ADMIN_PASSWORD=${ADMIN_PASSWORD}" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --timeout 15m
          helm list --namespace "$NAMESPACE"

      - name: Wait for the published release
        if: matrix.scenario == 'upgrade'
        run: .github/scripts/wait-ready.sh "$NAMESPACE" "$RELEASE"

      - name: Write data with the published release
        if: matrix.scenario == 'upgrade'
        run: .github/scripts/smoke-test.sh "$NAMESPACE" "$RELEASE" create-tag

      - name: Install or upgrade to this chart
        run: |
          helm upgrade --install "$RELEASE" ./paperless-ngx \
            --values paperless-ngx/ci/ct-values.yaml \
            --set "paperless.secrets.PAPERLESS_SECRET_KEY=${SECRET_KEY}" \
            --set "paperless.secrets.PAPERLESS_ADMIN_PASSWORD=${ADMIN_PASSWORD}" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --timeout 15m
          helm list --namespace "$NAMESPACE"

      - name: Wait for the release to be ready
        run: .github/scripts/wait-ready.sh "$NAMESPACE" "$RELEASE"

      - name: Smoke test
        run: |
          ACTION=""
          if [ "${{ matrix.scenario }}" = "upgrade" ]; then ACTION="check-tag"; fi
          .github/scripts/smoke-test.sh "$NAMESPACE" "$RELEASE" $ACTION

      - name: Check Paperless-NGX logs for errors
        run: |
          echo "=== Paperless-NGX container logs ==="
          kubectl logs deployment/paperless-ngx \
            --namespace paperless-test \
            --tail=500

          ERRORS=$(kubectl logs deployment/paperless-ngx \
            --namespace paperless-test \
            --tail=500 \
            | grep -E "^\s*\[?(ERROR|CRITICAL)\]?" \
            || true)

          if [ -n "$ERRORS" ]; then
            echo "::error::Errors found in Paperless-NGX logs:"
            echo "$ERRORS"
            exit 1
          fi

          echo "No errors found in Paperless-NGX logs."

      - name: Print diagnostics on failure
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl get pods --namespace paperless-test -o wide | tee pod-status.log

          echo "=== Recent events ==="
          kubectl get events --namespace paperless-test \
            --sort-by='.lastTimestamp' | tail -40 | tee events.log

          echo "=== Paperless-NGX logs ==="
          kubectl logs deployment/paperless-ngx \
            --namespace paperless-test --tail=200 2>&1 | tee paperless.log || true

          echo "=== Redis logs ==="
          kubectl logs deployment/paperless-ngx-redis \
            --namespace paperless-test --tail=50 2>&1 | tee redis.log || true

          echo "=== CNPG cluster status ==="
          kubectl describe cluster/paperless-ngx-postgres \
            --namespace paperless-test 2>&1 | tee cnpg-cluster.log || true

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: k8s-diagnostics-${{ matrix.scenario }}
          path: |
            pod-status.log
            events.log
            paperless.log
            redis.log
            cnpg-cluster.log
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Single status check summarising the integration matrix (keeps the
  # "Integration Test" check name stable for branch protection / auto-merge).
  # ---------------------------------------------------------------------------
  integration-result:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [changes, integration]
    if: always()
    steps:
      - name: Check integration results
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN_CI: ${{ needs.changes.outputs.run_ci }}
          RESULT: ${{ needs.integration.result }}
        run: |
          echo "changes=${CHANGES} run_ci=${RUN_CI} integration=${RESULT}"
          # Skipping is only fine when the path filter ran and found nothing
          # chart-related; a skip caused by a failed Lint job is a failure.
          if [ "$CHANGES" = "success" ] && [ "$RUN_CI" != "true" ]; then
            exit 0
          fi
          [ "$RESULT" = "success" ]
