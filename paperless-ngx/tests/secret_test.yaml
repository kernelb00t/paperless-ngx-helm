suite: paperless secret
templates:
  - templates/secret.yaml
tests:
  - it: fails without a secret key
    set:
      paperless.secrets.PAPERLESS_ADMIN_PASSWORD: admin-pass
    asserts:
      - failedTemplate:
          errorPattern: PAPERLESS_SECRET_KEY must be set

  - it: fails without an admin password
    set:
      paperless.secrets.PAPERLESS_SECRET_KEY: key
    asserts:
      - failedTemplate:
          errorPattern: PAPERLESS_ADMIN_PASSWORD must be set

  - it: is skipped with an existing secret
    set:
      paperless.existingSecret: external
    asserts:
      - hasDocuments:
          count: 0
