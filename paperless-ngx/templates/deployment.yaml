apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paperless-ngx.fullname" . }}
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
    app.kubernetes.io/component: paperless
spec:
  replicas: {{ .Values.paperless.replicaCount }}
  {{- with .Values.paperless.strategy }}
  {{- include "paperless-ngx.deploymentStrategy" . | nindent 2 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "paperless-ngx.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: paperless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "paperless-ngx.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: paperless
        {{- with .Values.paperless.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ toYaml .Values.paperless.config | sha256sum }}
        {{- if not .Values.paperless.existingSecret }}
        checksum/secret: {{ print .Release.Namespace "/" .Release.Name (toYaml .Values.paperless.secrets) | sha256sum }}
        {{- end }}
        {{- if and .Values.redis.enabled .Values.redis.password (not .Values.redis.passwordSecretKeyRef.name) }}
        checksum/redis-secret: {{ print .Release.Namespace "/" .Release.Name .Values.redis.password | sha256sum }}
        {{- end }}
        {{- with omit (.Values.paperless.podAnnotations | default dict) "checksum/config" "checksum/secret" "checksum/redis-secret" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "paperless-ngx.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "paperless-ngx.serviceAccountName" . }}
      {{- with .Values.paperless.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: paperless
          image: "{{ .Values.paperless.image.repository }}:{{ include "paperless-ngx.imageTag" . }}"
          imagePullPolicy: {{ .Values.paperless.image.pullPolicy }}
          {{- with .Values.paperless.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "paperless-ngx.secretName" . }}
          env:
            # ---- Required secret env vars (fail-fast check) ----
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperless-ngx.secretName" . }}
                  key: PAPERLESS_SECRET_KEY
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperless-ngx.secretName" . }}
                  key: PAPERLESS_ADMIN_PASSWORD
            # ---- Database (PostgreSQL via CloudNativePG) ----
            {{- if .Values.cnpg.enabled }}
            - name: PAPERLESS_DBENGINE
              value: "postgresql"
            - name: PAPERLESS_DBHOST
              value: {{ include "paperless-ngx.postgresServiceName" . | quote }}
            - name: PAPERLESS_DBPORT
              value: "5432"
            - name: PAPERLESS_DBNAME
              value: {{ .Values.cnpg.database | quote }}
            - name: PAPERLESS_DBUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperless-ngx.postgresAppSecretName" . }}
                  key: username
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "paperless-ngx.postgresAppSecretName" . }}
                  key: password
            {{- end }}
            # ---- Redis ----
            {{- if and .Values.redis.enabled (or .Values.redis.passwordSecretKeyRef.name .Values.redis.password) }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.redis.passwordSecretKeyRef.name }}
                  {{- toYaml .Values.redis.passwordSecretKeyRef | nindent 18 }}
                  {{- else }}
                  name: {{ include "paperless-ngx.fullname" . }}-redis
                  key: password
                  {{- end }}
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: PAPERLESS_REDIS
              value: {{ include "paperless-ngx.redisUrl" . | quote }}
            {{- end }}
            # ---- Gotenberg ----
            {{- if .Values.gotenberg.enabled }}
            - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
              value: {{ printf "http://%s:%d" (include "paperless-ngx.gotenbergServiceName" .) (int .Values.gotenberg.service.port) | quote }}
            {{- end }}
            # ---- Tika ----
            {{- if .Values.tika.enabled }}
            - name: PAPERLESS_TIKA_ENDPOINT
              value: {{ printf "http://%s:%d" (include "paperless-ngx.tikaServiceName" .) (int .Values.tika.service.port) | quote }}
            {{- end }}
            # ---- Config env vars (from configmap) ----
            {{- range $key, $val := .Values.paperless.config }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "paperless-ngx.fullname" $ }}-config
                  key: {{ $key }}
            {{- end }}

            # ---- Extra env vars ----
            {{- with .Values.paperless.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- if .Values.persistence.data.enabled }}
            - name: data
              mountPath: /usr/src/paperless/data
            {{- end }}
            {{- if .Values.persistence.media.enabled }}
            - name: media
              mountPath: /usr/src/paperless/media
            {{- end }}
            {{- if .Values.persistence.export.enabled }}
            - name: export
              mountPath: /usr/src/paperless/export
            {{- end }}
            {{- if .Values.persistence.consume.enabled }}
            - name: consume
              mountPath: /usr/src/paperless/consume
            {{- end }}
            {{- with .Values.paperless.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.paperless.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.paperless.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.paperless.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.persistence.data.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.data.existingClaim | default (printf "%s-data" (include "paperless-ngx.fullname" .)) }}
        {{- end }}
        {{- if .Values.persistence.media.enabled }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.media.existingClaim | default (printf "%s-media" (include "paperless-ngx.fullname" .)) }}
        {{- end }}
        {{- if .Values.persistence.export.enabled }}
        - name: export
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.export.existingClaim | default (printf "%s-export" (include "paperless-ngx.fullname" .)) }}
        {{- end }}
        {{- if .Values.persistence.consume.enabled }}
        - name: consume
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.consume.existingClaim | default (printf "%s-consume" (include "paperless-ngx.fullname" .)) }}
        {{- end }}
        {{- with .Values.paperless.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.paperless.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.paperless.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.paperless.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
