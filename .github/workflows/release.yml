name: Release Chart

# ─────────────────────────────────────────────────────────────────────────────
# Trigger: manual only for now.
# Uncomment the `push` block below to auto-release whenever Chart.yaml
# is changed on `main` (e.g. after the sync-upstream PR is merged).
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Chart version override (leave empty to use Chart.yaml)"
        required: false
        type: string

  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "paperless-ngx/Chart.yaml"

permissions:
  contents: write   # create releases, push gh-pages, commit CHANGELOG.md
  packages: write   # push to GHCR (OCI)
  pages: write      # GitHub Pages (gh-pages branch managed by chart-releaser)
  id-token: write   # OIDC (future use)

env:
  CHART_DIR: paperless-ngx
  OCI_REGISTRY: ghcr.io

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: Package · Release · Publish OCI
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      - name: Checkout (full history required for changelog)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Use GH_PAT when available so that the CHANGELOG.md push back to
          # main can trigger downstream workflows.  Falls back to the default
          # GITHUB_TOKEN (push will still work; CI on main won't re-trigger).
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # -----------------------------------------------------------------------
      - name: Set up Helm
        uses: azure/setup-helm@v5

      # -----------------------------------------------------------------------
      - name: Read chart metadata
        id: chart
        run: |
          VERSION="$(yq '.version'    ${{ env.CHART_DIR }}/Chart.yaml)"
          APP_VERSION="$(yq '.appVersion' ${{ env.CHART_DIR }}/Chart.yaml)"
          # Allow manual override of the version
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          fi
          echo "version=${VERSION}"         >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Chart version : ${VERSION}"
          echo "App version   : ${APP_VERSION}"

      # -----------------------------------------------------------------------
      - name: Install git-cliff
        run: |
          CLIFF_VERSION=$(curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/orhun/git-cliff/releases/latest" \
            | jq -r '.tag_name // "v2.6.1"' || echo "v2.6.1")
          echo "Installing git-cliff ${CLIFF_VERSION}"
          curl -sSfL \
            "https://github.com/orhun/git-cliff/releases/download/${CLIFF_VERSION}/git-cliff-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --wildcards --strip-components=1 -C /usr/local/bin '*/git-cliff'
          git-cliff --version

      # -----------------------------------------------------------------------
      - name: Generate per-release notes (for GitHub Release body)
        run: |
          git-cliff --latest --strip header \
            --output ${{ env.CHART_DIR }}/RELEASE_NOTES.md \
            2>/dev/null \
          || git log --oneline --no-merges -20 \
               --pretty="* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" \
               > ${{ env.CHART_DIR }}/RELEASE_NOTES.md
          echo "── Release notes ──────────────────────────"
          cat ${{ env.CHART_DIR }}/RELEASE_NOTES.md

      # -----------------------------------------------------------------------
      - name: Update cumulative CHANGELOG.md
        run: |
          git-cliff --output CHANGELOG.md 2>/dev/null \
            || echo "# Changelog" > CHANGELOG.md
          git add CHANGELOG.md
          # Only commit when there are actual changes
          git diff --cached --quiet \
            || git commit -m "docs: update CHANGELOG.md [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      # -----------------------------------------------------------------------
      # Classic release: packages the chart, creates a GitHub Release, and
      # updates index.yaml on the gh-pages branch (used as a Helm repository).
      - name: Release chart (classic — GitHub Pages + GitHub Releases)
        uses: helm/chart-releaser-action@v1
        with:
          charts_dir: .
          config: .github/cr.yaml
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # -----------------------------------------------------------------------
      # OCI release: push the chart to GHCR as an OCI artifact.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCI_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart for OCI
        run: |
          helm package ${{ env.CHART_DIR }} \
            --version     "${{ steps.chart.outputs.version }}" \
            --app-version "${{ steps.chart.outputs.app_version }}" \
            --destination /tmp/oci-charts

      - name: Push chart to OCI registry (GHCR)
        run: |
          helm push /tmp/oci-charts/*.tgz \
            oci://${{ env.OCI_REGISTRY }}/${{ github.repository_owner }}
          echo "✅ OCI chart available at:"
          echo "   oci://${{ env.OCI_REGISTRY }}/${{ github.repository_owner }}/paperless-ngx:${{ steps.chart.outputs.version }}"
